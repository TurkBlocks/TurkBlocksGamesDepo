
name: Update games.json

on:
  push:
    paths:
      - "*.html"
      - "games.json"
      - ".github/workflows/update-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: games.json oluştur
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp)"

          while IFS= read -r -d '' file; do
            filename="${file#./}"
            id="${filename%.html}"

            size="$(stat -c%s "$file")"
            size_mb="$(awk "BEGIN {printf \"%.2f\", $size / 1048576}")"

            jq -n \
              --arg id "$id" \
              --arg name "$id" \
              --arg version "1.0" \
              --arg url "$filename" \
              --arg file "$filename" \
              --arg description "$id" \
              --argjson size "$size" \
              --arg size_mb "$size_mb" \
              '{
                id: $id,
                name: $name,
                version: $version,
                url: $url,
                file: $file,
                size: $size,
                size_mb: ($size_mb | tonumber),
                description: $description
              }' >> "$tmp"

          done < <(find . -maxdepth 1 -type f -name "*.html" -print0 | sort -z)

          jq -s '{games: .}' "$tmp" > games.json
          rm "$tmp"

      - name: JSON kontrolü
        run: jq empty games.json

      - name: Git ayarları
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: games.json kaydet
        run: |
          git add games.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update games.json"
            git push
          fi
