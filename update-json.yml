
name: Update games.json

on:
  push:
    paths:
      - "*.html"
      - "*.HTML"
      - "*.Html"
      - "games.json"
      - ".github/workflows/update-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Oyunları bul ve games.json oluştur
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp)"

          find . -maxdepth 1 -type f -print0 |
          while IFS= read -r -d '' file; do
            filename="${file#./}"

            # Yalnızca kökteki HTML dosyalarını kabul et.
            if [[ "${filename##*.}" != [hH][tT][mM][lL] ]]; then
              continue
            fi

            name="${filename%.*}"

            jq -n \
              --arg name "$name" \
              --arg path "$filename" \
              '{name: $name, path: $path}' 
          done > "$tmp"

          jq -s 'sort_by(.name | ascii_downcase)' "$tmp" > games.json
          rm "$tmp"

      - name: JSON kontrolü
        run: |
          jq empty games.json
          echo "games.json geçerli."

      - name: Git ayarları
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: games.json kaydet
        run: |
          git add games.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Update games.json"
            git push
          fi
