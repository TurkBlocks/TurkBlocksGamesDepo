<title>TürkBlocks Chess</title>

<style>
    /* ================================
       GENEL
    ================================= */

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #111;
        color: #fff;

        font-family: Arial, sans-serif;
    }


    /* ================================
       ANA KUTU
    ================================= */

    .game {
        width: min(94vw, 700px);
        text-align: center;
    }

    .game-title {
        margin: 0 0 20px;

        font-size: 32px;
        font-weight: 700;
    }


    /* ================================
       SATRANÇ TAHTASI
    ================================= */

    .board {
        width: min(90vw, 640px);
        aspect-ratio: 1 / 1;

        margin: 0 auto;

        display: grid;
        grid-template-columns: repeat(8, 1fr);

        border: 4px solid #500000;
        border-radius: 10px;

        overflow: hidden;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.5);
    }


    /* ================================
       KARELER
    ================================= */

    .square {
        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(28px, 7vw, 60px);

        cursor: pointer;
        user-select: none;

        transition: filter 0.15s ease;
    }

    .square:hover {
        filter: brightness(1.15);
    }

    .light {
        background: #eee;
    }

    .dark {
        background: #777;
    }

    .selected {
        outline: 4px solid #500000;
        outline-offset: -4px;
    }


    /* ================================
       DURUM
    ================================= */

    .status {
        margin-top: 18px;
        padding: 12px 16px;

        background: #1c1c1c;

        border-radius: 8px;

        font-size: 16px;
    }


    /* ================================
       BUTON
    ================================= */

    .reset-button {
        margin-top: 15px;
        padding: 11px 22px;

        border: 0;
        border-radius: 8px;

        background: #500000;
        color: #fff;

        font-size: 15px;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .reset-button:hover {
        background: #700000;
        transform: translateY(-1px);
    }
</style>

<!-- =================================
     OYUN
================================== -->

<main class="game">

    <h1 class="game-title">
        TürkBlocks Chess
    </h1>

    <div
        id="board"
        class="board"
        aria-label="Satranç tahtası">
    </div>

    <div
        id="status"
        class="status">
        Sıra: Beyaz
    </div>

    <button
        id="resetButton"
        class="reset-button">
        Oyunu Sıfırla
    </button>

</main>


<script>

    /* =================================
       OYUN VERİLERİ
    ================================= */

    const initialBoard = [
        ["♜", "♞", "♝", "♛", "♚", "♝", "♞", "♜"],
        ["♟", "♟", "♟", "♟", "♟", "♟", "♟", "♟"],
        ["",   "",   "",   "",   "",   "",   "",   ""],
        ["",   "",   "",   "",   "",   "",   "",   ""],
        ["",   "",   "",   "",   "",   "",   "",   ""],
        ["",   "",   "",   "",   "",   "",   "",   ""],
        ["♙", "♙", "♙", "♙", "♙", "♙", "♙", "♙"],
        ["♖", "♘", "♗", "♕", "♔", "♗", "♘", "♖"]
    ];

    let board = copyBoard(initialBoard);

    let selectedSquare = null;

    let currentTurn = "white";


    /* =================================
       HTML ELEMANLARI
    ================================= */

    const boardElement =
        document.getElementById("board");

    const statusElement =
        document.getElementById("status");

    const resetButton =
        document.getElementById("resetButton");


    /* =================================
       YARDIMCI FONKSİYONLAR
    ================================= */

    function copyBoard(source) {
        return source.map(row => [...row]);
    }


    function isWhitePiece(piece) {
        return "♙♖♘♗♕♔".includes(piece);
    }


    function isBlackPiece(piece) {
        return "♟♜♞♝♛♚".includes(piece);
    }


    function isCurrentPlayerPiece(piece) {

        if (currentTurn === "white") {
            return isWhitePiece(piece);
        }

        return isBlackPiece(piece);
    }


    /* =================================
       TAHTAYI OLUŞTUR
    ================================= */

    function renderBoard() {

        boardElement.innerHTML = "";

        for (let row = 0; row < 8; row++) {

            for (let col = 0; col < 8; col++) {

                const square =
                    document.createElement("div");

                square.classList.add("square");

                const isLight =
                    (row + col) % 2 === 0;

                square.classList.add(
                    isLight ? "light" : "dark"
                );


                square.textContent =
                    board[row][col];


                if (
                    selectedSquare &&
                    selectedSquare.row === row &&
                    selectedSquare.col === col
                ) {
                    square.classList.add("selected");
                }


                square.addEventListener(
                    "click",
                    () => handleSquareClick(row, col)
                );


                boardElement.appendChild(square);
            }
        }
    }


    /* =================================
       KARE TIKLAMA
    ================================= */

    function handleSquareClick(row, col) {

        const piece = board[row][col];


        // Henüz taş seçilmediyse
        if (!selectedSquare) {

            if (!piece) {
                return;
            }

            if (!isCurrentPlayerPiece(piece)) {
                return;
            }

            selectedSquare = {
                row: row,
                col: col
            };

            renderBoard();

            return;
        }


        // Aynı taşa tekrar tıklandı
        if (
            selectedSquare.row === row &&
            selectedSquare.col === col
        ) {
            selectedSquare = null;

            renderBoard();

            return;
        }


        movePiece(
            selectedSquare.row,
            selectedSquare.col,
            row,
            col
        );
    }


    /* =================================
       TAŞ HAREKETİ
    ================================= */

    function movePiece(
        fromRow,
        fromCol,
        toRow,
        toCol
    ) {

        const movingPiece =
            board[fromRow][fromCol];

        const targetPiece =
            board[toRow][toCol];


        // Kendi taşını yiyemez
        if (
            targetPiece &&
            isCurrentPlayerPiece(targetPiece)
        ) {
            selectedSquare = {
                row: toRow,
                col: toCol
            };

            renderBoard();

            return;
        }


        board[toRow][toCol] =
            movingPiece;

        board[fromRow][fromCol] =
            "";


        selectedSquare = null;

        switchTurn();

        renderBoard();
    }


    /* =================================
       SIRA DEĞİŞTİR
    ================================= */

    function switchTurn() {

        currentTurn =
            currentTurn === "white"
                ? "black"
                : "white";


        statusElement.textContent =
            currentTurn === "white"
                ? "Sıra: Beyaz"
                : "Sıra: Siyah";
    }


    /* =================================
       OYUNU SIFIRLA
    ================================= */

    function resetGame() {

        board =
            copyBoard(initialBoard);

        selectedSquare =
            null;

        currentTurn =
            "white";

        statusElement.textContent =
            "Sıra: Beyaz";

        renderBoard();
    }


    /* =================================
       BUTON
    ================================= */

    resetButton.addEventListener(
        "click",
        resetGame
    );


    /* =================================
       OYUNU BAŞLAT
    ================================= */

    renderBoard();

</script>

</body>

</html>
